 skaitmen\u0173 suma \u2014 vien\u0105 kart\u0105 (nebesuma\u017Einama)",matrix_fill:"DD+MM+YYYY skaitmenys + A+B+C+D skaitmenys; nuliai praleid\u017Eiami; pasikartojantys skai\u010Diuojami kiekvien\u0105 kart\u0105"},matrix_layout:{rows:["1-4-7","2-5-8","3-6-9"],columns:["1-2-3","4-5-6","7-8-9"],diagonals:["1-5-9","3-5-7"]},cells:[{digit:1,theme:{lt:"Charakteris ir valia",en:"Character and will"},traditionalMeaning:"Valia, charakterio stiprumas (instrumo.ru)",sourceUrls:["https://www.thelib.ru/books/aleksandr_fedorovich_aleksandrov/cifrovoy_analiz_dat_rozhdeniya_i_sobytiy_kniga_1_psihomatrica_i_ee_svoystva-read-2.html"],verification:"general traditional theme checked; original non-predictive adaptation; cell 4 health meaning deliberately replaced with everyday attentiveness; pending Claude review",bands:[{countBand:"0",text:{lt:"Vienet\u0173 nebuvimas matricoje formuoja mink\u0161t\u0105, prisitaikan\u010Di\u0105 asmenyb\u0117s a\u0161\u012F. Tavo stipryb\u0117 kyla ne i\u0161 poreikio pirmauti ar primesti savo vali\u0105 kitiems, o i\u0161 geb\u0117jimo organi\u0161kai \u012Fsilieti \u012F bendr\u0105 proces\u0105 ir pajusti aplinkos dinamik\u0105. Tu veiki per empatij\u0105 ir lankstum\u0105, {vengdamas|vengdama} kaktomu\u0161os. Tikrasis stuburas atsiskleid\u017Eia ramioje i\u0161tikimyb\u0117je savo principams be jokio i\u0161orinio spaudimo.",en:"The absence of ones indicates an adaptable, receptive personal core. Your strength does not stem from imposing your will or dominating the room, but from intuitively reading group dynamics and flowing with collective energy. You lead through empathy and diplomacy rather than confrontation. Your true resolve reveals itself as quiet loyalty to your principles without theatrical displays of authority."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: nepa\u017Eym\u0117t\u0105 tem\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Valia ugdytina, da\u017Eni svyravimai (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"1",text:{lt:"Vienas vienetas \u017Eymi individualisto prad\u0105, kuriam b\u016Btina asmenin\u0117 erdv\u0117 sprendimams priimti. Tau svarbu jaustis savo gyvenimo {\u0161eimininku|\u0161eimininke}, tod\u0117l grie\u017Etas i\u0161orinis vadovavimas ar spaudimas kelia nat\u016Bral\u0173 pasiprie\u0161inim\u0105. Tu nem\u0117gsti tu\u0161\u010Di\u0173 gin\u010D\u0173 \u2013 ver\u010Diau atsitrauki ir padarai visk\u0105 savaip. Tai {nepriklausomo k\u016Br\u0117jo ir autonomi\u0161ko vykdytojo|nepriklausomos k\u016Br\u0117jos ir autonomi\u0161kos vykdytojos} para\u0161as, vertinantis laisv\u0119 labiau u\u017E pripa\u017Einim\u0105.",en:"A single one reflects a self-contained mindset that demands complete autonomy. Direct external control triggers natural resistance, as you need full ownership over your decisions. You rarely waste energy on trivial arguments; instead, you quietly withdraw and execute things your own way. This is the mark of an independent creator who values personal sovereignty above public validation."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: besiformuojant\u012F akcent\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Vidutin\u0117 valia (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"2",text:{lt:"Du vienetai kuria optimal\u0173 valios ir lankstumo balans\u0105. Tavo autoritetas remiasi ne spaudimu ar balsu, o ramiu argumentu, pagarba oponentui ir taktikos pajautimu. Tu gebi apginti savo ribas be konflikto ir meistri\u0161kai rasti kompromisus, kurie tenkina abi puses. Tai prigimtinis {diplomato ir derybininko|diplomat\u0117s ir derybinink\u0117s} talentas, u\u017Etikrinantis stabil\u0173 jud\u0117jim\u0105 \u012F priek\u012F.",en:"A pair of ones establishes an optimal balance of determination and tact. Your authority never relies on sheer force; it stands on composed arguments, mutual respect, and precise timing. You defend your boundaries without escalating tension and excel at negotiating mutually beneficial outcomes. This is the natural signature of a diplomat who achieves goals through measured persuasion."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: tolyg\u0173 akcent\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Stipri valia (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"3",text:{lt:"Trys vienetai \u017Eymi stipri\u0105, dinami\u0161k\u0105 ir ekspresyvi\u0105 valios a\u0161\u012F. Tavo asmenyb\u0117 turi prigimtin\u012F magnetizm\u0105 \u2013 \u017Emon\u0117s nat\u016Braliai atsigr\u0119\u017Eia \u012F tavo id\u0117jas ir laukia krypties. Kai tave pagauna \u012Fkv\u0117pimas, entuziazmas tampa u\u017Ekre\u010Diamas ir geba pajudinti did\u017Eiausius projektus. Esmin\u0117 u\u017Eduotis \u2013 neleisti energijos \u0161uoliams virsti impulsyvumu ir nukreipti \u0161\u012F u\u017Etais\u0105 \u012F ilgalaik\u012F rezultat\u0105.",en:"Three ones signal a bold, expressive, and magnetic will. You project a commanding presence that naturally draws others toward your vision and leadership. When inspired, your enthusiasm is contagious, easily mobilizing teams and launching ambitious initiatives. The key challenge lies in grounding these energetic surges so they fuel disciplined, long-term impact rather than short-lived bursts."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: situaci\u0161kai suaktyv\u0117jant\u012F akcent\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Labai stipri valia, galimas u\u017Esispyrimas (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"4",text:{lt:"Keturi vienetai formuoja gele\u017Ein\u0117s valios ir lyderyst\u0117s dominant\u0119. Tai charakteris, sukurtas didel\u0117ms atsakomyb\u0117ms, krizi\u0173 valdymui ir ai\u0161ki\u0173 taisykli\u0173 diegimui. Tu netoleruoji chaoso ar dviprasmybi\u0173, o tavo vidinis reiklumas sau yra toks pat auk\u0161tas kaip ir aplinkai. \u0160i koncentruota galia geriausiai skleid\u017Eiasi ten, kur reikia strateginio prover\u017Eio ir principingo tikslo gynimo.",en:"Four ones produce an unshakeable powerhouse of executive will and resilience. You are hardwired for large-scale responsibility, crisis navigation, and establishing clear structures. You have zero tolerance for ambiguity or chaos, holding yourself to the same uncompromising standards you expect from others. This formidable drive thrives in high-stakes environments that demand decisive, principled leadership."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: ry\u0161k\u0173 akcent\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Dominuojantis charakteris (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"5+",text:{lt:"Penki ar daugiau vienet\u0173 atveria ret\u0105, maksimalios valios koncentracij\u0105 \u2013 absoliut\u0173 {lyderio ir architekto|lyder\u0117s ir architekt\u0117s} profil\u012F. Tavo vidin\u0117 j\u0117ga gali pakeisti aplinkini\u0173 realyb\u0119 ir perlau\u017Eti net pa\u010Dias nepalankiausias aplinkybes. Tu esi {sutvertas|sutverta} vesti, formuoti taisykles ir stov\u0117ti prie\u0161akyje, {nepaisydamas|nepaisydama} jokio pasiprie\u0161inimo. Did\u017Eiausias \u0161ios j\u0117gos meistri\u0161kumas pasiekiamas tada, kai gele\u017Ein\u0117 valia tarnauja auk\u0161tesnei id\u0117jai ir tampa kit\u0173 saugumo garantu.",en:"Five or more ones unlock a rare, absolute concentration of executive force\u2014the profile of an architect of reality. Your focused determination has the gravitas to reshape environments and bend adverse circumstances to your objective. You are built to pioneer, establish order, and lead from the front lines regardless of opposition. The pinnacle of this strength is reached when an unyielding will serves a transcendent mission, becoming a shield of protection for others."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: labai gaus\u0173 pasikartojim\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Itin dominuojantis charakteris (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}}]},{digit:2,theme:{lt:"Gyvybin\u0117 energija / I\u0161tverm\u0117",en:"Vital energy / Stamina"},traditionalMeaning:"Gyvybin\u0117 energija, bioenergetika (instrumo.ru)",sourceUrls:["https://www.thelib.ru/books/aleksandr_fedorovich_aleksandrov/cifrovoy_analiz_dat_rozhdeniya_i_sobytiy_kniga_1_psihomatrica_i_ee_svoystva-read-2.html"],verification:"general traditional theme checked; original non-predictive adaptation; cell 4 health meaning deliberately replaced with everyday attentiveness; pending Claude review",bands:[{countBand:"0",text:{lt:"Dvejet\u0173 nebuvimas rei\u0161kia, kad tavo gyvybin\u0117 energija n\u0117ra saugoma statin\u0117se vidin\u0117se talpyklose \u2013 ji veikia kaip pratekantis kanalas. Tu krauniesi per i\u0161orines erdves: gamt\u0105, estetik\u0105, prasmingus pokalbius ir gryn\u0105 or\u0105. Rutininis bendravimas su negatyviais \u017Emon\u0117mis tave greitai i\u0161siurbia, tod\u0117l energetin\u0117 higiena tau yra b\u016Btinyb\u0117. Tavo j\u0117ga atsiskleid\u017Eia ramioje, \u0161varioje aplinkoje, kurioje gali netrukdomai persikrauti.",en:"The absence of twos indicates that vital energy is not stored in static internal reservoirs; it operates as an open conduit. You recharge externally through natural landscapes, visual aesthetics, clean air, and high-frequency environments. Heavy social chatter drains you quickly, making boundary protection essential for your vitality. Your stamina peaks when you allow yourself regular periods of solitude to reset your baseline."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: nepa\u017Eym\u0117t\u0105 tem\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Ma\u017Ea gyvybin\u0117 energija (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"1",text:{lt:"Vienas dvejetas nurodo tiksli\u0105, taupi\u0105 ir nukreipt\u0105 energijos sistem\u0105. Tu nesi {tas, kuris|ta, kuri} \u0161vaistyt\u0173si emocijomis ar bla\u0161kyt\u0173si keliuose frontuose vienu metu \u2013 tavo baterija sukurta konkre\u010Diam, ai\u0161kiam tikslui. Kai \u017Einai veiksm\u0173 prasm\u0119, tavo d\u0117mesys tampa lazeriu, atliekan\u010Diu u\u017Eduot\u012F be joki\u0173 pa\u0161alini\u0173 trikd\u017Ei\u0173. Pagrindinis tavo principas \u2013 energijos taupymas ir s\u0105moningas poilsis po kiekvieno etapo.",en:"A single two reflects an economical, highly focused energy distribution system. You do not disperse vitality on frivolous drama; your resources are calibrated for defined, meaningful targets. When aligned with a clear purpose, your concentration turns into a laser beam, executing priorities with zero waste. Your core strategy lies in conscious energy conservation and structured recovery intervals between sprints."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: besiformuojant\u012F akcent\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Vidutin\u0117 energija (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"2",text:{lt:"Du dvejetai yra optimalios, tolygiai pasiskirstan\u010Dios gyvybin\u0117s energijos etalonas. Tu turi puik\u0173 vidin\u012F generatori\u0173, kuris leid\u017Eia dirbti ilgai, palaikyti aktyv\u0173 socialin\u012F gyvenim\u0105 ir greitai atsigauti po streso. \u0160is resursas daro tave patikima atrama kitiems: aplinkiniai jau\u010Dia tavo stabilum\u0105 ir ramyb\u0119. Tu gebi be vargo derinti protin\u012F darb\u0105 su fizine veikla, {i\u0161laikydamas|i\u0161laikydama} pastov\u0173 temp\u0105.",en:"A pair of twos represents the gold standard of steady, self-renewing vitality. You possess a dependable internal engine that sustains long work hours, active social engagement, and swift recovery from fatigue. This balanced reservoir makes you an anchor for those around you, as people naturally gravitate toward your grounded energy. You effortlessly bridge physical demands and intellectual tasks with consistent endurance."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: tolyg\u0173 akcent\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Gera energija (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"3",text:{lt:"Trys dvejetai suteikia stipr\u0173 ekstrasensorin\u012F ir energetin\u012F jautrum\u0105. Tavo k\u016Bnas akimirksniu nuskenuoja patalpos atmosfer\u0105 ir \u017Emoni\u0173 emocinius laukus, kartais net anks\u010Diau, nei jie patys tai \u012Fsis\u0105monina. \u0160i energija gali pasireik\u0161ti kaip a\u0161trus intuityvus vedimas arba staig\u016Bs j\u0117g\u0173 antpl\u016Bd\u017Eiai, leid\u017Eiantys atlikti mil\u017Eini\u0161kos apimties darbus. {I\u0161mok\u0119s|I\u0161mokusi} atskirti svetimas nuotaikas nuo sav\u0173, tampi {ne\u012Fveikiamu strategu ir nat\u016Braliu gydytoju|ne\u012Fveikiama stratege ir nat\u016Bralia gydytoja}.",en:"Three twos endow you with heightened psychosomatic sensitivity and a dynamic energetic field. Your system instantly reads room atmospheres and emotional undercurrents before words are spoken. This vibration surfaces as sharp intuitive guidance or sudden surges of immense vitality capable of turning mountains. When you master screening out external noise, this becomes an exceptional gift for healing, influence, and strategic empathy."},question:{lt:"",en:""},traditiona ntBand:"5+",text:{lt:"Penki ar daugiau dvejet\u0173 atveria stulbinant\u012F, retai sutinkam\u0105 energijos reaktori\u0173. Tai mil\u017Eini\u0161kas energetinis laukas, galintis transformuoti erdv\u0119 aplink tave ir tiesiogiai veikti kit\u0173 savijaut\u0105 bei sprendimus. Tu turi j\u0117gos atlaikyti ekstremalias perkrovas ir atstatyti aplinkini\u0173 resursus net krizin\u0117se situacijose. Tavo buvimas stabilizuoja bet koki\u0105 audr\u0105, jei tik s\u0105moningai valdai \u0161\u012F galing\u0105 sraut\u0105 ir nukreipi j\u012F \u012F apsaug\u0105 bei k\u016Bryb\u0105.",en:"Five or more twos manifest a rare, high-output human dynamo. Your field carries exceptional transformative power, subtly influencing the vitality and emotional equilibrium of entire environments. You are equipped to endure extreme pressures and revitalize others through sheer presence during institutional or personal crises. Your aura commands attention and stabilizes chaos, provided this vast force is channeled into protective, creative architecture."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: labai gaus\u0173 pasikartojim\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"I\u0161skirtin\u0117 energija (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}}]},{digit:3,theme:{lt:"Pa\u017Einimas ir smalsumas",en:"Learning and curiosity"},traditionalMeaning:"Moksliniai geb\u0117jimai, atmintis, pa\u017Einimas (instrumo.ru). PASTABA: negalima daryti intelekto lygio i\u0161vad\u0173.",sourceUrls:["https://www.thelib.ru/books/aleksandr_fedorovich_aleksandrov/cifrovoy_analiz_dat_rozhdeniya_i_sobytiy_kniga_1_psihomatrica_i_ee_svoystva-read-2.html"],verification:"general traditional theme checked; original non-predictive adaptation; cell 4 health meaning deliberately replaced with everyday attentiveness; pending Claude review",bands:[{countBand:"0",text:{lt:"Trejeto nebuvimas rodo gryn\u0105, intuityvi\u0105 ir nestandartin\u0119 m\u0105stymo form\u0105. Tu nesi {link\u0119s|linkusi} kaupti fakt\u0173 vien tam, kad juos kauptum \u2013 tau r\u016Bpi id\u0117jos prasm\u0117 ir globali esm\u0117, o ne sausos taisykl\u0117s ar instrukcijos. Mokaisi per asmenin\u012F patyrim\u0105 ir d\u0117sningum\u0173 \u012F\u017Evalg\u0105, {apeidamas|apeidama} tradicines schemas. Tavo protas atviras originaliems sprendimams, nes jo neriboja \u012Fprasti dogm\u0173 r\u0117mai.",en:"The absence of threes points to an intuitive, non-linear cognitive style. You care little for hoarding trivial facts or memorizing rigid technical manuals; you seek overarching patterns, emotional truth, and profound meaning. You absorb knowledge organically through immersive experience rather than traditional scholastic formulas. Your mind excels at innovative leaps precisely because it is unburdened by dogma."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: nepa\u017Eym\u0117t\u0105 tem\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Mokymasis per patirt\u012F, ne teorij\u0105 (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"1",text:{lt:"Vienas trejetas atveria pragmati\u0161k\u0105 ir tiksling\u0105 smalsum\u0105. Tu domiesi tuo, k\u0105 galima tuoj pat pritaikyti praktikoje, optimizuoti ar paversti realiu rezultatu. Nesi {link\u0119s|linkusi} skrajoti tu\u0161\u010Diose teorijose \u2013 nauja informacija tave sudomina tik tada, kai ji sprend\u017Eia konkre\u010Di\u0105 problem\u0105 ar atveria ai\u0161k\u0173 prana\u0161um\u0105. Tai meistri\u0161kas instrumentinis protas, atrenkantis pa\u010Dius veiksmingiausius \u012Frankius.",en:"A single three reflects practical, targeted curiosity. You explore disciplines that can be immediately operationalized, optimized, and turned into concrete utility. You rarely indulge in aimless theoretical speculation; new knowledge catches your interest only when it solves a real bottleneck or provides leverage. This produces a pragmatic intellect that filters out noise and masters effective tools."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: besiformuojant\u012F akcent\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Vidutiniai pa\u017Eintiniai geb\u0117jimai (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"2",text:{lt:"Du trejetai \u017Eymi universal\u0173, strukt\u016Bruot\u0105 ir techni\u0161kai iml\u0173 prot\u0105. Tu gebi greitai perprasti sud\u0117tingas sistemas, technologijas, tiksliuosius mokslus ar algoritm\u0173 schemas. Tavo stipryb\u0117 \u2013 sujungti logik\u0105 su praktine meistryste, matyti, kaip veikia mechanizmai i\u0161 vidaus, ir juos tobulinti. Tai nat\u016Bralus {analitiko, in\u017Einieriaus ar tyr\u0117jo|analitik\u0117s, in\u017Einier\u0117s ar tyr\u0117jos} talentas, lengvai \u012Fsisavinantis nauj\u0105 informacijos klod\u0105.",en:"A pair of threes endows you with a versatile, structured, and technically astute mind. You quickly decipher intricate frameworks, algorithms, emerging technologies, and empirical structures. Your brilliance lies in merging logic with functional execution\u2014understanding how internal gears turn and optimizing their efficiency. This is the natural foundation of an engineer, systems designer, or analytical researcher."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: tolyg\u0173 akcent\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Geri analitiniai geb\u0117jimai (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"3",text:{lt:"Trys trejetai sukuria galing\u0105 \u017Eini\u0173 ir inovacij\u0173 alk\u012F. Tavo protas veikia kaip daugiakanalis procesorius: tu vienu metu gali tyrin\u0117ti kelias skirtingas mokslo, technologij\u0173 ar meno sritis ir netik\u0117tai rasti j\u0173 bendr\u0105 vardikl\u012F. Turi aistr\u0105 eksperimentams, naujov\u0117ms ir giliam konceptualiam modeliavimui. Did\u017Eiausia vert\u0117 sukuriama, kai \u0161\u012F berib\u012F smalsum\u0105 sukoncentruoji \u012F vienos kompleksin\u0117s sistemos prover\u017E\u012F.",en:"Three threes ignite an insatiable drive for intellectual exploration and cross-disciplinary innovation. Your cognition operates like a multi-threaded processor, effortlessly parsing different domains and synthesizing them into radical new frameworks. You thrive on empirical experiments, modern tools, and conceptual modeling. The greatest breakthrough occurs when this panoramic curiosity is laser-focused on conquering a single complex problem."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: situaci\u0161kai suaktyv\u0117jant\u012F akcent\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Stipri analitika (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"4",text:{lt:"Keturi trejetai \u017Eymi enciklopedin\u012F prot\u0105 ir i\u0161skirtin\u012F talent\u0105 sisteminimui. Tu sugebi suskaidyti net pat\u012F sud\u0117tingiausi\u0105 chaos\u0105 \u012F ai\u0161kias schemas, metodologijas ir loginius algoritmus. Tavo geb\u0117jimas kaupti, r\u016B\u0161iuoti ir operuoti dideliais duomen\u0173 masyvais yra neeilinis. Tai mokslo reformatori\u0173, metodolog\u0173 ir did\u017Ei\u0173j\u0173 architekt\u0173 \u017Eenklas, gebantis sukurti nauj\u0105 standart\u0105 ten, kur anks\u010Diau vie\u0161patavo ne\u017Einia.",en:"Four threes produce an encyclopedic intellect with a genius for classification and architectural logic. You take chaotic datasets and translate them into airtight taxonomies, streamlined algorithms, and actionable models. Your capacity to absorb, organize, and synthesize monumental volumes of data is extraordinary. This is the hallmark of a master methodologist capable of constructing entire operating standards from scratch."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: ry\u0161k\u0173 akcent\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Labai stiprus pa\u017Eintinis laukas (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"5+",text:{lt:"Penki ar daugiau trejet\u0173 atveria ret\u0105 konceptualaus genijaus ir absoliutaus smalsumo potencial\u0105. Tavo m\u0105stymas veikia toli u\u017E \u012Fprast\u0173 rib\u0173 \u2013 tu gebi kurti visi\u0161kai naujas mokslo paradigmas, informacines kalbas ar 0160is balansas padeda i\u0161laikyti pagarb\u0105 praktiniam darbui, neu\u017Estringant jame ilgiau, nei b\u016Btina.",en:"A single six provides pragmatic dexterity and a disciplined approach to physical and technical work. You grasp exactly how to ground an abstract vision into functional execution, stepping up to the frontline when the build demands it. Yet work is never an obsession for its own sake\u2014it is your chosen mechanism to secure stability and tangible results. This grounding bridges abstract ideation with physical production smoothly."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: besiformuojant\u012F akcent\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Vidutinis darb\u0161tumas, ai\u0161ki kryptis (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"2",text:{lt:"Du \u0161e\u0161etai \u017Eymi tikr\u0105 meistryst\u0117s, kruop\u0161tumo ir auksini\u0173 rank\u0173 dovan\u0105. Tu jauti ypating\u0105 pasitenkinim\u0105 {matydamas|matydama} savo rankomis ar tiesioginiu darbu sukurt\u0105, nepriekai\u0161tingai veikiant\u012F rezultat\u0105. Tavo d\u0117mesys detal\u0117ms, technologiniam procesui ir atlikimo kokybei kelia pasitik\u0117jim\u0105 ir daro tave {nepakei\u010Diamu profesionalu|nepakei\u010Diama profesionale} savo srityje. Tai amato, in\u017Einerijos ar taikomojo meno talentas, transformuojantis med\u017Eiag\u0105 \u012F auk\u0161t\u0105 vert\u0119.",en:"A pair of sixes reflects craftsmanship, precision, and the gift of applied mastery. You take immense satisfaction in engineering flawless, highly tangible deliverables with your own hands and direct effort. Your reverence for detail, structural integrity, and execution quality makes you an indispensable powerhouse in your discipline. This is the signature of an engineer or elite craftsman who converts raw material into enduring functional value."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: tolyg\u0173 akcent\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Darb\u0161tumas ir k\u016Brybi\u0161kumas kartu (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"3",text:{lt:"Trys \u0161e\u0161etai sukuria galing\u0105 trauk\u0105 fiziniam pasauliui, meistri\u0161kumui ir didelio masto materializacijai. Tu turi talent\u0105 valdyti sud\u0117tingus gamybos, statybos, finans\u0173 ar materiali\u0173j\u0173 resurs\u0173 srautus. Tai magnetin\u0117 asmenyb\u0117, gebanti pavergti materij\u0105 savo valiai ir sukurti ap\u010Diuopiamas, ilgalaikes imperijas. Esminis \u0161ios dominant\u0117s balansas \u2013 derinti materiali\u0105j\u0105 meistryst\u0119 su vidin\u0117mis vertyb\u0117mis, kad did\u017Eiul\u0117 energija tarnaut\u0173 ilgalaikei gerovei.",en:"Three sixes unlock magnetic control over the physical domain, material fabrication, and tactical execution. You possess a rare knack for governing complex construction, logistics, financial assets, and industrial output. This is a commanding profile capable of bending heavy physical friction to its will to establish tangible, lasting infrastructure. Balancing this practical dominance with high-level ethics ensures that massive productivity builds lasting, generational impact."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: situaci\u0161kai suaktyv\u0117jant\u012F akcent\u0105; ne individuali\u0173 savybi\u0173 \u pritraukia palankias aplinkybes.",en:"A pair of sevens marks acute intuitive protection and strong creative magnetism. Synchronicity frequently appears along your path: the right people, concepts, and opportunities surface precisely when required. You have a keen ear for systemic harmony, aesthetics, language, or imagery, effortlessly translating abstract visions into compelling realities. It is the signature of an inspired creator whose internal composure draws favorable currents."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: tolyg\u0173 akcent\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Ry\u0161k\u016Bs talentai (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"3",text:{lt:"Trys septynetai atveria ret\u0105 gilumin\u0117s sintez\u0117s kanal\u0105 \u2013 geb\u0117jim\u0105 pamatyti d\u0117sningumus ten, kur kiti mato tik chaoti\u0161kas detales. Tai a\u0161tri intuicija, likimo apsaugos jausmas ir prigimtinis poreikis kurti savitas sistemas, apeinant standartinius \u0161ablonus. Tavo protas geba sujungti skirtingus pasaulius \u012F vientis\u0105, magi\u0161k\u0105 k\u016Brin\u012F ar veikian\u010Di\u0105 strukt\u016Br\u0105. Did\u017Eiausia galia atsiskleid\u017Eia tada, kai \u0161i\u0105 vizij\u0105 dr\u0105siai \u012Fk\u016Bniji ap\u010Diuopiamoje formoje.",en:"Three sevens unlock a rare channel of deep synthesis\u2014the ability to decipher underlying patterns where others perceive only chaotic noise. It signals razor-sharp intuition, profound fortune, and an innate drive to build original architectures beyond conventional archetypes. Your mind bridges disparate worlds into singular, transformative creations or living structures. The true magnitude of this alignment emerges when abstract insight is boldly anchored into physical reality."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: situaci\u0161kai suaktyv\u0117jant\u012F akcent\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Stipr\u016Bs, \u012Fvairiapusi\u0161ki talentai (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"4",text:{lt:"Keturi septynetai formuoja galing\u0105 {vizionieriaus ir k\u016Brybinio vedlio|vizionier\u0117s ir k\u016Brybin\u0117s vedl\u0117s} profil\u012F. Tavo intuicija veikia beveik absoliu\u010Diu tikslumu, atverdama prieig\u0105 prie universali\u0173 d\u0117sni\u0173 ir pas\u0105monini\u0173 klod\u0173. Tu gebi generuoti id\u0117jas, kurios pralenkia savo laikmet\u012F de\u0161imtme\u010Diais ir kei\u010Dia aplinkini\u0173 suvokim\u0105 apie tai, kas \u012Fmanoma. \u0160is lygis reikalauja didel\u0117s dvasin\u0117s atsakomyb\u0117s, nes tavo kuriami vaizdiniai greitai tampa matoma tikrove.",en:"Four sevens generate a powerhouse profile of visionary leadership and high creative authority. Your intuition operates with exceptional fidelity, granting unhindered access to universal laws and unconscious currents. You generate paradigm-shifting concepts that outpace your era and fundamentally reframe what others deem possible. This altitude demands deliberate purpose, as the mental models you formulate have an uncanny tendency to materialize into concrete reality."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: ry\u0161k\u0173 akcent\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Labai stipr\u016Bs talentai ext; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"1",text:{lt:"Vienas a\u0161tuonetas suteikia subalansuot\u0105 pareigos jausm\u0105 ir pagarb\u0105 duotam \u017Eod\u017Eiui. Tu supranti susitarim\u0173 vert\u0119, laiku vykdai \u012Fsipareigojimus ir esi {patikimas partneris|patikima partner\u0117} tiek \u0161eimoje, tiek veikloje. Ta\u010Diau moki i\u0161laikyti sveik\u0105 rib\u0105 \u2013 neprisiimi svetim\u0173 problem\u0173 na\u0161tos ir neaukoji sav\u0119s d\u0117l kit\u0173 patogumo. Tai brandi atsakomyb\u0117, garantuojanti stabilum\u0105 ir tarpusavio pasitik\u0117jim\u0105.",en:"A single eight provides a balanced sense of duty and principled respect for commitments. You honor agreements, deliver reliably on your word, and stand as an accountable ally in personal and professional alliances. Crucially, you maintain healthy boundaries\u2014refusing to shoulder baggage that belongs to others or compromise your well-being for another's convenience. This grounded accountability fosters enduring trust and strategic reliability."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: besiformuojant\u012F akcent\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Vidutinis pareigos jausmas (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"2",text:{lt:"Du a\u0161tuonetai formuoja stipr\u0173 teisingumo jausm\u0105, prigimtin\u012F {glob\u0117jo|glob\u0117jos} prad\u0105 ir geb\u0117jim\u0105 r\u016Bpintis kitais. Tu nat\u016Braliai prisiimi atsakomyb\u0119 u\u017E savo aplink\u0105, komand\u0105 ar \u0161eim\u0105, {tapdamas|tapdama} jiems saugiu u\u017Enugariu. Tavo \u017Eodis turi didel\u012F svor\u012F, o neteisyb\u0117 kelia gil\u0173 nor\u0105 atstatyti ties\u0105 ir pusiausvyr\u0105. Tai {patikimo vedlio ir glob\u0117jo profilis, kurio|patikimos vedl\u0117s ir glob\u0117jos profilis, kurios} atsidavimas kuria tvirt\u0105 pasitik\u0117jimo lauk\u0105.",en:"A pair of eights establishes an acute instinct for justice, natural stewardship, and protective leadership. You instinctively assume responsibility for your ecosystem, providing a dependable shield and reliable anchor for those under your wing. Your word carries immense gravity, and unfairness triggers an immediate drive to restore equilibrium. This is the hallmark of a guardian whose steadfast devotion creates an environment of psychological and material safety."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: tolyg\u0173 akcent\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Stiprus pareigos jausmas (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"3",text:{lt:"Trys a\u0161tuonetai atveria didelio masto visuomenin\u0117s ar sistemin\u0117s atsakomyb\u0117s dominant\u0119. Tai charakteris, pa\u0161auktas spr\u0119sti globalius teisingumo, dideli\u0173 organizacij\u0173 ar bendruomeni\u0173 reikalus. Tavo pareigos jausmas per\u017Eengia asmeninius r\u0117mus \u2013 tu jauti atsakomyb\u0119 u\u017E bendr\u0105 gerov\u0119 ir ilgalaikius procesus. \u0160i didel\u0117 j\u0117ga suteikia pelnyt\u0105 autoritet\u0105 ir pagarb\u0105, jei tik moki laiku atsitraukti ir pasaugoti savo vidinius resursus.",en:"Three eights signal a formidable calling toward systemic accountability and high-stakes governance. You are hardwired to referee systemic justice, manage complex collective interests, and steer large-scale community or corporate institutions. Your sense of mission extends far beyond the personal sphere to embrace collective order and enduring institutional health. This commanding drive commands natural deference, provided you institute disciplined boundaries to replenish your core energy."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: situaci\u0161kai suaktyv\u0117jant\u012F akcent\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Labai stipri atsakomyb\u0117 (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"4",text:{lt:"Keturi a\u0161tuonetai \u017Eymi monumental\u0173 pareigos ir kantryb\u0117s pamat\u0105 \u2013 tikr\u0105 tiesos ir tvarkos stulp\u0105. Tu gebi ne\u0161ti atsakomyb\u0117s na\u0161t\u0105, kuri palau\u017Et\u0173 daugum\u0105, ir i\u0161likti {nepaperkamas, principingas bei ramus|nepaperkama, principinga bei rami} bet kokioje kriz\u0117je. Tavo gyvenimo a\u0161is \u2013 teisingumas, \u012Fstatymas ir auk\u0161\u010Diausia atsakomyb\u0117 prie\u0161 savo idealus. \u0160i reta savyb\u0117 daro tave autoritetu, kuriuo aklai pasitikima sunkiausiomis apsisprendimo akimirkomis.",en:"Four eights construct a monumental fortress of endurance, unshakeable integrity, and principled order. You are built to shoulder institutional burdens that would crush conventional resolve, remaining incorruptible, poised, and focused under fire. Your core axis is anchored in equity, duty, and uncompromising accountability to foundational standards. This rare gravitas makes you the definitive anchor sought out during systemic crises."},quest efore others perceive the shift. This is the pedigree of visionary philosophers and grand strategists whose counsel steers enterprise."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: ry\u0161k\u0173 akcent\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Labai stiprus istorinis jautimas (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"5+",text:{lt:"Penki ar daugiau devynet\u0173 \u017Eymi absoliu\u010Di\u0105 intelekto ir archetipin\u0117s i\u0161minties vir\u0161\u016Bn\u0119. Tavo s\u0105mon\u0117 veikia kaip universali \u017Einijos biblioteka, gebanti akimirksniu perprasti bet koki\u0105 sistem\u0105 ar \u017Emogaus prigimt\u012F. \u010Cia atmintis nustoja b\u016Bti tik faktais \u2013 ji tampa gyva, gilia \u012F\u017Evalga apie pasaulio sandar\u0105 ir gyvenimo ciklus. Tai genijaus intelektas, pa\u0161auktas formuoti naujas \u017Einojimo sistemas ir vesti \u017Emonij\u0105 per id\u0117j\u0173 evoliucij\u0105.",en:"Five or more nines unlock the ultimate summit of cognitive architecture and archetypal wisdom. Your mind functions as an unconstrained repository of universal principles, reading human nature and systemic dynamics with effortless clarity. Here, intellect transcends raw facts to become dynamic, living comprehension of historical cycles and fundamental mechanics. This is visionary genius destined to codify advanced paradigms and pioneer intellectual evolution."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: labai gaus\u0173 pasikartojim\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"I\u0161skirtinis atminties laukas (instrumo.ru)",provenance:{so ; pending Claude review"}},Water:{name:{lt:"Vanduo",en:"Water"},color:{lt:"m\u0117lynai \u017Eali\u0105",en:"teal"},environment:{lt:"e\u017Eero pakrant\u0119, kurioje atsispindi \u017Evaig\u017Edynai",en:"a lakeshore reflecting constellations"},material:{lt:"perlamutr\u0105 ir lengv\u0105 audin\u012F",en:"mother-of-pearl and soft fabric"},mood:{lt:"\u0161veln\u0173 susikaupim\u0105",en:"gentle attentiveness"},light:{lt:"atspind\u0117t\u0105 m\u0117nesien\u0105",en:"reflected moonlight"},symbol:{lt:"\u017Evaig\u017Edyn\u0173 linijas",en:"constellation lines"},provenance:{sourceIds:["project-art-direction-2026-10-06"],verification:"original editorial mapping; not a traditional or scientific correspondence; pending Claude review"}}},westernSigns:{Capricorn:{name:{lt:"O\u017Eiaragis",en:"Capricorn"},symbol:{lt:"laiptai \u012F kaln\u0173 observatorij\u0105",en:"steps to a mountain observatory"},theme:{lt:"nuoseklum\u0105 ir rib\u0173 pasirinkim\u0105",en:"consistency and chosen boundaries"},question:{lt:"Kuriam ilgalaikiam sumanymui nor\u0117tum skirti vien\u0105 ma\u017E\u0105 \u017Eingsn\u012F?",en:"What long-term project deserves one small step from you?"},provenance:{sourceIds:["zodiac-editorial","project-art-direction-2026-10-06"],verification:"editorial symbolic motif; pending Claude review"},prose:{lt:"Tavo mintis ie\u0161ko atramos ir auk\u0161\u010Dio vienu metu: didelis sumanymas tau prasideda nuo tikro pamato. Tavo vidinis matas \u2013 ap\u010Diuopiama vert\u0117; id\u0117ja \u012Fgauna svor\u012F tada, kai randa viet\u0105 tikrov\u0117je. Tavo i\u0161rai\u0161kai reikia savito b\u016Bdo, kuriame vidin\u0117 laikysena sutapt\u0173 su veiksmu. Kai \u0161is ry\u0161ys ai\u0161kus, \u017Eenklas \u012Fgauna tavo asmenin\u012F bals\u0105.",en:"Your thought seeks support and elevation at once: a large ambition begins with a real foundation. Tangible value is your inner measure; an idea gains weight when it finds a place in reality. Your expression needs a personal form where inner stance and action meet. When that connection is clear, the sign takes on your own voice."}},Aquarius:{name:{lt:"Vandenis",en:"Aquarius"},symbol:{lt:"vandens bangos, virstan\u010Dios \u017Evaig\u017Ed\u0117mis",en:"water waves transforming into stars"},theme:{lt:"savaranki\u0161k\u0105 \u017Evilgsn\u012F ir bendryst\u0119",en:"an independent perspective and community"},question:{lt:"Kur nor\u0117tum pasi\u016Blyti sav\u0105 po\u017Ei\u016Br\u012F, kartu i\u0161klausant kitus?",en:"Where would you like to offer your own perspective while hearing others?"},provenance:{sourceIds:["zodiac-editorial","project-art-direction-2026-10-06"],verification:"editorial symbolic motif; pending Claude review"},prose:{lt:"Tavo mintis nepasilieka ten, kur baigiasi \u012Fprastos taisykl\u0117s: chaoti\u0161kose detal\u0117se ie\u0161kai dar nesud\u0117liotos sistemos. Tau reikia erdv\u0117s mintims, savaranki\u0161kam \u017Evilgsniui ir ry\u0161iui, kuriame artumas neu\u017Erakina laisv\u0117s. Tavo i\u0161rai\u0161kai reikia savito b\u016Bdo, kuriame vidin\u0117 laikysena sutapt\u0173 su veiksmu. Kai \u0161is ry\u0161ys ai\u0161kus, \u017Eenklas \u012Fgauna tavo asmenin\u012F bals\u0105.",en:"Your thought does not stop where familiar rules end: within scattered details, you seek a system not yet assembled. You need room for thought, an independent perspective, and a connection where closeness does not imprison freedom. Your expression needs a personal form where inner stance and action meet. When that connection is clear, the sign takes on your own voice."}},Pisces:{name:{lt:"\u017Duvys",en:"Pisces"},symbol:{lt:"dvi \u0161viesos \u017Euvys",en:"two fish made of light"},theme:{lt:"vaizduot\u0119 ir jautrum\u0105 aplinkai",en:"imagination and attentiveness to surroundings"},question:{lt:"Kok\u012F jausm\u0105 nor\u0117tum i\u0161reik\u0161ti k\u016Brybi\u0161kai?",en:"What feeling would you like to express creatively?"},provenance:{sourceIds:["zodiac-editorial","project-art-direction-2026-10-06"],verification:"editorial symbolic motif; pending Claude review"},prose:{lt:"Tavo vidin\u0117 erdv\u0117 sujungia nuotaik\u0105, vaizdin\u012F ir prasm\u0119 anks\u010Diau, nei visa tai \u012Fgauna ai\u0161kius \u017Eod\u017Eius. Tavo sprendimuose gyvena gilus vidinis rezonansas; i\u0161orin\u012F triuk\u0161m\u0105 perleid\u017Eia asmenin\u0117s prasm\u0117s filtras. Tavo i\u0161rai\u0161kai reikia savito b\u016Bdo, kuriame vidin\u0117 laikysena sutapt\u0173 su veiksmu. Kai \u0161is ry\u0161ys ai\u0161kus, \u017Eenklas \u012Fgauna tavo asmenin\u012F bals\u0105.",en:"Your inner world connects mood, image, and meaning before they take the shape of clear words. A deep inner resonance lives in your decisions; a filter of personal meaning receives the noise of the outside world. Your expression needs a personal form where inner stance and action meet. When that connection is clear, the sign takes on your own voice."}},Aries:{name:{lt:"Avinas",en:"Aries"},symbol:{lt:"\u0161vytintis avino rag\u0173 ornamentas",en:"a luminous ram-horn ornament"},theme:{lt:"iniciatyv\u0105 ir prad\u017Ei\u0105",en:"initiative and beginnings"},question:{lt:"K\u0105 nor\u0117tum prad\u0117ti, paliekant vietos ir kantrybei?",en:"What would you like to begin while making room for patience?"},provenance:{sourceIds:["zodiac-editorial","project-art-direction-2026-10-06"],verification:"editorial symbolic motif; pending Claude review"},prose:{lt:"Tavo viduje pirmiausia sujuda prad\u017Eios ugnis: ten, kur kiti dar tariasi, tu jau ie\u0161kai pirmojo veiksmo. Tavo veikimo kalba \u2013 impulsas ir dr\u0105sa; ai\u0161kus tikslas paver\u010Dia kibirk\u0161t\u012F kryptingu jud\u0117jimu. Tavo i\u0161rai\u0161kai reikia savito b\u016Bdo, kuriame vidin\u0117 laikysena sutapt\u0173 su veiksmu. Kai \u0161is ry\u0161ys ai\u0161kus, \u017Eenklas \u012Fgauna tavo asmenin\u012F bals\u0105.",en:"The fire of beginnings moves first within you: where others are still discussing, you seek the opening move. Impulse and courage shape your action; a clear goal turns the spark into purposeful motion. Your expression needs a personal form where inner stance and action meet. When that connection is clear, the sign takes on your own voice."}},Taurus:{name:{lt:"Jautis",en:"Taurus"},symbol:{lt:"\u017Eem\u0117s jau\u010Dio reljefas",en:"an earth-bull relief"},theme:{lt:"pastovum\u0105 ir paprast\u0173 dalyk\u0173 vert\u0119",en:"steadiness and the value of simple things"},question:{lt:"Kas tavo kasdienybei suteikia atram\u0105?",en:"What gives your daily life a sense of grounding?"},provenance:{sourceIds:["zodiac-editorial","project-art-direction-2026-10-06"],verification:"editorial symbolic motif; pending Claude review"},prose:{lt:"Tavo stipryb\u0117 turi svor\u012F: renkiesi tai, kas atlaiko laik\u0105, prisilietim\u0105 ir tikr\u0105 kasdienyb\u0117s i\u0161bandym\u0105. Tavo vidinis matas \u2013 ap\u010Diuopiama vert\u0117; id\u0117ja \u012Fgauna svor\u012F tada, kai randa viet\u0105 tikrov\u0117je. Tavo i\u0161rai\u0161kai reikia savito b\u016Bdo, kuriame vidin\u0117 laikysena sutapt\u0173 su veiksmu. Kai \u0161is ry\u0161ys ai\u0161kus, \u017Eenklas \u012Fgauna tavo asmenin\u012F bals\u0105.",en:"Your strength has weight: you choose what can withstand time, contact, and the real test of daily life. Tangible value is your inner measure; an idea gains weight when it finds a place in reality. Your expression needs a personal form where inner stance and action meet. When that connection is clear, the sign takes on your own voice."}},Gemini:{name:{lt:"Dvyniai",en:"Gemini"},symbol:{lt:"du susisiekiantys \u017Evaig\u017Ed\u017Ei\u0173 lankai",en:"two linked arcs of stars"},theme:{lt:"dialog\u0105 ir smalsum\u0105",en:"dialogue and curiosity"},question:{lt:"Su kuo pokalbis gal\u0117t\u0173 prapl\u0117sti tavo po\u017Ei\u016Br\u012F?",en:"Who could broaden your perspective through conversation?"},provenance:{sourceIds:["zodiac-editorial","project-art-direction-2026-10-06"],verification:"editorial symbolic motif; pending Claude review"},prose:{lt:"Tavo mintis keliauja tarp skirting\u0173 pasauli\u0173 ir sujungia juos netik\u0117tu sakiniu, klausimu ar id\u0117ja. Tau reikia erdv\u0117s mintims, savaranki\u0161kam \u017Evilgsniui ir ry\u0161iui, kuriame artumas neu\u017Erakina laisv\u0117s. Tavo i\u0161rai\u0161kai reikia savito b\u016Bdo, kuriame vidin\u0117 laikysena sutapt\u0173 su veiksmu. Kai \u0161is ry\u0161ys ai\u0161kus, \u017Eenklas \u012Fgauna tavo asmenin\u012F bals\u0105.",en:"Your thought travels between different worlds and connects them through an unexpected phrase, question, or idea. You need room for thought, an independent perspective, and a connection where closeness does not imprison freedom. Your expression needs a personal form where inner stance and action meet. When that connection is clear, the sign takes on your own voice."}},Cancer:{name:{lt:"V\u0117\u017Eys",en:"Cancer"},symbol:{lt:"sidabrin\u0117 kriaukl\u0117",en:"a silver shell"},theme:{lt:"artum\u0105 ir asmenin\u0119 erdv\u0119",en:"closeness and personal space"},question:{lt:"Kokioje aplinkoje tau lengviausia b\u016Bti savimi?",en:"In what setting do you find it easiest to be yourself?"},provenance:{sourceIds:["zodiac-editorial","project-art-direction-2026-10-06"],verification:"editorial symbolic motif; pending Claude review"},prose:{lt:"Tavo vidinis pasaulis saugo tai, ko ne\u012Fmanoma pasverti: artumo atmint\u012F, atmosfer\u0105 ir nei\u0161tart\u0105 ry\u0161\u012F. Tavo sprendimuose gyvena gilus vidinis rezonansas; i\u0161orin\u012F triuk\u0161m\u0105 perleid\u017Eia asmenin\u0117s prasm\u0117s filtras. Tavo i\u0161rai\u0161kai reikia savito b\u016Bdo, kuriame vidin\u0117 laikysena sutapt\u0173 su veiksmu. Kai \u0161is ry\u0161ys ai\u0161kus, \u017Eenklas \u012Fgauna tavo asmenin\u012F bals\u0105.",en:"Your inner world preserves what cannot be weighed: the memory of closeness, atmosphere, and unspoken connection. A deep inner resonance lives in your decisions; a filter of personal meaning receives the noise of the outside world. Your expression needs a personal form where inner stance and action meet. When that connection is clear, the sign takes on your own voice."}},Leo:{name:{lt:"Li\u016Btas",en:"Leo"},symbol:{lt:"saul\u0117s formos li\u016Bto medalionas",en:"a solar lion medallion"},theme:{lt:"savirai\u0161k\u0105 ir dosnum\u0105",en:"self-expression and generosity"},question:{lt:"Kuo nor\u0117tum pasidalyti nesiekiant aplodisment\u0173?",en:"What would you like to share without seeking applause?"},provenance:{sourceIds:["zodiac-editorial","project-art-direction-2026-10-06"],verification:"editorial symbolic motif; pending Claude review"},prose:{lt:"Tavo k\u016Bryba prasideda nuo vidin\u0117s teis\u0117s b\u016Bti matomai i\u0161rai\u0161kai: darbui suteiki savo bals\u0105 ir dr\u0105s\u0173 mast\u0105. Tavo veikimo kalba \u2013 impulsas ir dr\u0105sa; ai\u0161kus tikslas paver\u010Dia kibirk\u0161t\u012F kryptingu jud\u0117jimu. Tavo i\u0161rai\u0161kai reikia savito b\u016Bdo, kuriame vidin\u0117 laikysena sutapt\u0173 su veiksmu. Kai \u0161is ry\u0161ys ai\u0161kus, \u017Eenklas \u012Fgauna tavo asmenin\u012F bals\u0105.",en:"Your creativity begins with the right to visible expression: you give the work a personal voice and a bold scale. Impulse and courage shape your action; a clear goal turns the spark into purposeful motion. Your expression needs a personal form where inner stance and action meet. When that connection is clear, the sign takes on your own voice."}},Virgo:{name:{lt:"Mergel\u0117",en:"Virgo"},symbol:{lt:"smulkus varp\u0173 ornamentas",en:"a delicate grain-ear ornament"},theme:{lt:"atidum\u0105 detal\u0117ms ir r\u016Bpesting\u0105 veikl\u0105",en:"attention to detail and thoughtful action"},question:{lt:"K\u0105 verta patobulinti, o kam jau pakanka b\u016Bti pakankamai geram?",en:"What deserves refinement, and what is already good enough?"},provenance:{sourceIds:["zodiac-editorial","project-art-direction-2026-10-06"],verification:"editorial symbolic motif; pending Claude review"},prose:{lt:"Ten, kur vaizdas i\u0161silieja, tavo d\u0117mesys suranda detal\u0119, nuo kurios viskas v\u0117l tampa ai\u0161ku. Tavo vidinis matas \u2013 ap\u010Diuopiama vert\u0117; id\u0117ja \u012Fgauna svor\u012F tada, kai randa viet\u0105 tikrov\u0117je. Tavo i\u0161rai\u0161kai reikia savito b\u016Bdo, kuriame vidin\u0117 laikysena sutapt\u0173 su veiksmu. Kai \u0161is ry\u0161ys ai\u0161kus, \u017Eenklas \u012Fgauna tavo asmenin\u012F bals\u0105.",en:"Where the picture blurs, your attention finds the detail that brings everything back into focus. Tangible value is your inner measure; an idea gains weight when it finds a place in reality. Your expression needs a personal form where inner stance and action meet. When that connection is clear, the sign takes on your own voice."}},Libra:{name:{lt:"Svarstykl\u0117s",en:"Libra"},symbol:{lt:"dvi subalansuotos \u0161viesos taur\u0117s",en:"two balanced cups of light"},theme:{lt:"derm\u0119 ir skirting\u0173 po\u017Ei\u016Bri\u0173 pasv\u0117rim\u0105",en:"harmony and weighing different perspectives"},question:{lt:"Kur pusiausvyrai reikia ai\u0161kaus tavo pasirinkimo?",en:"Where does balance call for a clear choice from you?"},provenance:{sourceIds:["zodiac-editorial","project-art-direction-2026-10-06"],verification:"editorial symbolic motif; pending Claude review"},prose:{lt:"Tavo \u017Evilgsnis pagauna \u012Ftamp\u0105 tarp dviej\u0173 pusi\u0173 ir ie\u0161ko formos, kurioje abi gal\u0117t\u0173 i\u0161likti savimi. Tau reikia erdv\u0117s mintims, savaranki\u0161kam \u017Evilgsniui ir ry\u0161iui, kuriame artumas neu\u017Erakina laisv\u0117s. Tavo i\u0161rai\u0161kai reikia savito b\u016Bdo, kuriame vidin\u0117 laikysena sutapt\u0173 su veiksmu. Kai \u0161is ry\u0161ys ai\u0161kus, \u017Eenklas \u012Fgauna tavo asmenin\u012F bals\u0105.",en:"Your gaze catches the tension between two sides and seeks a form in which both can retain their identity. You need room for thought, an independent perspective, and a connection where closeness does not imprison freedom. Your expression needs a personal form where inner stance and action meet. When that connection is clear, the sign takes on your own voice."}},Scorpio:{name:{lt:"Skorpionas",en:"Scorpio"},symbol:{lt:"obsidiano skorpiono seg\u0117",en:"an obsidian scorpion brooch"},theme:{lt:"susitelkim\u0105 ir atvirum\u0105 sau",en:"focus and honesty with yourself"},question:{lt:"Apie k\u0105 nor\u0117tum sau pasakyti atviriau?",en:"What would you like to be more honest with yourself about?"},provenance:{sourceIds:["zodiac-editorial","project-art-direction-2026-10-06"],verification:"editorial symbolic motif; pending Claude review"},prose:{lt:"Tavo d\u0117mesys leid\u017Eiasi \u017Eemiau pavir\u0161iaus: gra\u017Eaus atsakymo neu\u017Etenka, kol neatsiveria jo vidin\u0117 tiesa. Tavo sprendimuose gyvena gilus vidinis rezonansas; i\u0161orin\u012F triuk\u0161m\u0105 perleid\u017Eia asmenin\u0117s prasm\u0117s filtras. Tavo i\u0161rai\u0161kai reikia savito b\u016Bdo, kuriame vidin\u0117 laikysena sutapt\u0173 su veiksmu. Kai \u0161is ry\u0161ys ai\u0161kus, \u017Eenklas \u012Fgauna tavo asmenin\u012F bals\u0105.",en:"Your attention descends beneath the surface: a polished answer is not enough until its inner truth emerges. A deep inner resonance lives in your decisions; a filter of personal meaning receives the noise of the outside world. Your expression needs a personal form where inner stance and action meet. When that connection is clear, the sign takes on your own voice."}},Sagittarius:{name:{lt:"\u0160aulys",en:"Sagittarius"},symbol:{lt:"\u017Evaig\u017Ed\u017Ei\u0173 lankas ir str\u0117l\u0117",en:"a bow and arrow made of stars"},theme:{lt:"tyrin\u0117jim\u0105 ir platesn\u0119 perspektyv\u0105",en:"exploration and a wider perspective"},question:{lt:"Koki\u0105 nauj\u0105 patirt\u012F nor\u0117tum pa\u017Einti neskubant spr\u01 :"original archetypal prose; editorial draft"}}},matrix:{"1":{lt:"Darbe tau gali b\u016Bti svarbu tur\u0117ti teis\u0119 pasirinkti b\u016Bd\u0105, o ne vien gauti tikslias instrukcijas; tuomet atsakomyb\u0119 lengviau priimi kaip sav\u0105.",en:"At work, having a say in the approach may matter more to you than receiving exact instructions; responsibility then feels like something you choose.",provenance:{sourceIds:["v3-symbolic-themes","v4-original-editorial"],status:"original-symbolic-synthesis; awaiting-Claude-review",scientificValidation:!1}},"2":{lt:"Bendrame darbe gali pasteb\u0117ti, kada verta \u012Fsitraukti visu paj\u0117gumu, o kada palikti erdv\u0117s kitam, u\u017Euot vis\u0105 laik\u0105 i\u0161laikius t\u0105 pat\u012F temp\u0105.",en:"In shared work, you may notice when to engage fully and when to leave room for someone else instead of keeping the same pace throughout.",provenance:{sourceIds:["v3-symbolic-themes","v4-original-editorial"],status:"original-symbolic-synthesis; awaiting-Claude-review",scientificValidation:!1}},"3":{lt:"K\u016Bryboje tu gali prad\u0117ti nuo klausimo ar ma\u017Eo bandymo, kurio nauda dar neai\u0161ki, bet b\u016Btent jis leid\u017Eia rasti netik\u0117t\u0105 krypt\u012F.",en:"When creating, you may begin with a question or a small experiment whose value is not yet clear but which opens an unexpected direction.",provenance:{sourceIds:["v3-symbolic-themes","v4-original-editorial"],status:"original-symbolic-synthesis; awaiting-Claude-review",scientificValidation:!1}},"4":{lt:"Kai id\u0117j\u0173 daug, tu gali gr\u0105\u017Einti d\u0117mes\u012F \u012F konkret\u0173 darb\u0105: k\u0105 galima sutvarkyti, paruo\u0161ti ar u\u017Ebaigti dabar.",en:"When ideas multiply, you may bring attention back to a concrete task: what can be arranged, prepared or completed now.",provenance:{sourceIds:["v3-symbolic-themes","v4-original-editorial"],status:"original-symbolic-synthesis; awaiting-Claude-review",scientificValidation:!1}},"5":{lt: will or dominating the room, but from intuitively reading group dynamics and flowing with collective energy. You lead through empathy and diplomacy rather than confrontation. Your true resolve reveals itself as quiet loyalty to your principles without theatrical displays of authority."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: nepa\u017Eym\u0117t\u0105 tem\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Valia ugdytina, da\u017Eni svyravimai (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"1",text:{lt:"Vienas vienetas \u017Eymi individualisto prad\u0105, kuriam b\u016Btina asmenin\u0117 erdv\u0117 sprendimams priimti. Tau svarbu jaustis savo gyvenimo {\u0161eimininku|\u0161eimininke}, tod\u0117l grie\u017Etas i\u0161orinis vadovavimas ar spaudimas kelia nat\u016Bral\u0173 pasiprie\u0161inim\u0105. Tu nem\u0117gsti tu\u0161\u010Di\u0173 gin\u010D\u0173 \u2013 ver\u010Diau atsitrauki ir padarai visk\u0105 savaip. Tai {nepriklausomo k\u016Br\u0117jo ir autonomi\u0161ko vykdytojo|nepriklausomos k\u016Br\u0117jos ir autonomi\u0161kos vykdytojos} para\u0161as, vertinantis laisv\u0119 labiau u\u017E pripa\u017Einim\u0105.",en:"A single one reflects a self-contained mindset that demands complete autonomy. Direct external control triggers natural resistance, as you need full ownership over your decisions. You rarely waste energy on trivial arguments; instead, you quietly withdraw and execute things your own way. This is the mark of an independent creator who values personal sovereignty above public validation."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: besiformuojant\u012F akcent\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Vidutin\u0117 valia (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"2",text:{lt:"Du vienetai kuria optimal\u0173 valios ir lankstumo balans\u0105. Tavo autoritetas remiasi ne spaudimu ar balsu, o ramiu argumentu, pagarba oponentui ir taktikos pajautimu. Tu gebi apginti savo ribas be konflikto ir meistri\u0161kai rasti kompromisus, kurie tenkina abi puses. Tai prigimtinis {diplomato ir derybininko|diplomat\u0117s ir derybinink\u0117s} talentas, u\u017Etikrinantis stabil\u0173 jud\u0117jim\u0105 \u012F priek\u012F.",en:"A pair of ones establishes an optimal balance of determination and tact. Your authority never relies on sheer force; it stands on composed arguments, mutual respect, and precise timing. You defend your boundaries without escalating tension and excel at negotiating mutually beneficial outcomes. This is the natural signature of a diplomat who achieves goals through measured persuasion."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: tolyg\u0173 akcent\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Stipri valia (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"3",text:{lt:"Trys vienetai \u017Eymi stipri\u0105, dinami\u0161k\u0105 ir ekspresyvi\u0105 valios a\u0161\u012F. Tavo asmenyb\u0117 turi prigimtin\u012F magnetizm\u0105 \u2013 \u017Emon\u0117s nat\u016Braliai atsigr\u0119\u017Eia \u012F tavo id\u0117jas ir laukia krypties. Kai tave pagauna \u012Fkv\u0117pimas, entuziazmas tampa u\u017Ekre\u010Diamas ir geba pajudinti did\u017Eiausius projektus. Esmin\u0117 u\u017Eduotis \u2013 neleisti energijos \u0161uoliams virsti impulsyvumu ir nukreipti \u0161\u012F u\u017Etais\u0105 \u012F ilgalaik\u012F rezultat\u0105.",en:"Three ones signal a bold, expressive, and magnetic will. You project a commanding presence that naturally draws others toward your vision and leadership. When inspired, your enthusiasm is contagious, easily mobilizing teams and launching ambitious initiatives. The key challenge lies in grounding these energetic surges so they fuel disciplined, long-term impact rather than short-lived bursts."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: situaci\u0161kai suaktyv\u0117jant\u012F akcent\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Labai stipri valia, galimas u\u017Esispyrimas (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"4",text:{lt:"Keturi vienetai formuoja gele\u017Ein\u0117s valios ir lyderyst\u0117s dominant\u0119. Tai charakteris, sukurtas didel\u0117ms atsakomyb\u0117ms, krizi\u0173 valdymui ir ai\u0161ki\u0173 taisykli\u0173 diegimui. Tu netoleruoji chaoso ar dviprasmybi\u0173, o tavo vidinis reiklumas sau yra toks pat auk\u0161tas kaip ir aplinkai. \u0160i koncentruota galia geriausiai skleid\u017Eiasi ten, kur reikia strateginio prover\u017Eio ir principingo tikslo gynimo.",en:"Four ones produce an unshakeable powerhouse of executive will and resilience. You are hardwired for large-scale responsibility, crisis navigation, and establishing clear structures. You have zero tolerance for ambiguity or chaos, holding yourself to the same uncompromising standards you expect from others. This formidable drive thrives in high-stakes environments that demand decisive, principled leadership."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: ry\u0161k\u0173 akcent\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Dominuojantis charakteris (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"5+",text:{lt:"Penki ar daugiau vienet\u0173 atveria ret\u0105, maksimalios valios koncentracij\u0105 \u2013 absoliut\u0173 {lyderio ir architekto|lyder\u0117s ir architekt\u0117s} profil\u012F. Tavo vidin\u0117 j\u0117ga gali pakeisti aplinkini\u0173 realyb\u0119 ir perlau\u017Eti net pa\u010Dias nepalankiausias aplinkybes. Tu esi {sutvertas|sutverta} vesti, formuoti taisykles ir stov\u0117ti prie\u0161akyje, {nepaisydamas|nepaisydama} jokio pasiprie\u0161inimo. Did\u017Eiausias \u0161ios j\u0117gos meistri\u0161kumas pasiekiamas tada, kai gele\u017Ein\u0117 valia tarnauja auk\u0161tesnei id\u0117jai ir tampa kit\u0173 saugumo garantu.",en:"Five or more ones unlock a rare, absolute concentration of executive force\u2014the profile of an architect of reality. Your focused determination has the gravitas to reshape environments and bend adverse circumstances to your objective. You are built to pioneer, establish order, and lead from the front lines regardless of opposition. The pinnacle of this strength is reached when an unyielding will serves a transcendent mission, becoming a shield of protection for others."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: labai gaus\u0173 pasikartojim\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Itin dominuojantis charakteris (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}}]},{digit:2,theme:{lt:"Gyvybin\u0117 energija / I\u0161tverm\u0117",en:"Vital energy / Stamina"},traditionalMeaning:"Gyvybin\u0117 energija, bioenergetika (instrumo.ru)",sourceUrls:["https://www.thelib.ru/books/aleksandr_fedorovich_aleksandrov/cifrovoy_analiz_dat_rozhdeniya_i_sobytiy_kniga_1_psihomatrica_i_ee_svoystva-read-2.html"],verification:"general traditional theme checked; original non-predictive adaptation; cell 4 health meaning deliberately replaced with everyday attentiveness; pending Claude review",bands:[{countBand:"0",text:{lt:"Dvejet\u0173 nebuvimas rei\u0161kia, kad tavo gyvybin\u0117 energija n\u0117ra saugoma statin\u0117se vidin\u0117se talpyklose \u2013 ji veikia kaip pratekantis kanalas. Tu krauniesi per i\u0161orines erdves: gamt\u0105, estetik\u0105, prasmingus pokalbius ir gryn\u0105 or\u0105. Rutininis bendravimas su negatyviais \u017Emon\u0117mis tave greitai i\u0161siurbia, tod\u0117l energetin\u0117 higiena tau yra b\u016Btinyb\u0117. Tavo j\u0117ga atsiskleid\u017Eia ramioje, \u0161varioje aplinkoje, kurioje gali netrukdomai persikrauti.",en:"The absence of twos indicates that vital energy is not stored in static internal reservoirs; it operates as an open conduit. You recharge externally through natural landscapes, visual aesthetics, clean air, and high-frequency environments. Heavy social chatter drains you quickly, making boundary protection essential for your vitality. Your stamina peaks when you allow yourself regular periods of solitude to reset your baseline."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: nepa\u017Eym\u0117t\u0105 tem\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Ma\u017Ea gyvybin\u0117 energija (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"1",text:{lt:"Vienas dvejetas nurodo tiksli\u0105, taupi\u0105 ir nukreipt\u0105 energijos sistem\u0105. Tu nesi {tas, kuris|ta, kuri} \u0161vaistyt\u0173si emocijomis ar bla\u0161kyt\u0173si keliuose frontuose vienu metu \u2013 tavo baterija sukurta konkre\u010Diam, ai\u0161kiam tikslui. Kai \u017Einai veiksm\u0173 prasm\u0119, tavo d\u0117mesys tampa lazeriu, atliekan\u010Diu u\u017Eduot\u012F be joki\u0173 pa\u0161alini\u0173 trikd\u017Ei\u0173. Pagrindinis tavo principas \u2013 energijos taupymas ir s\u0105moningas poilsis po kiekvieno etapo.",en:"A single two reflects an economical, highly focused energy distribution system. You do not disperse vitality on frivolous drama; your resources are calibrated for defined, meaningful targets. When aligned with a clear purpose, your concentration turns into a laser beam, executing priorities with zero waste. Your core strategy lies in conscious energy conservation and structured recovery intervals between sprints."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: besiformuojant\u012F akcent\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Vidutin\u0117 energija (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"2",text:{lt:"Du dvejetai yra optimalios, tolygiai pasiskirstan\u010Dios gyvybin\u0117s energijos etalonas. Tu turi puik\u0173 vidin\u012F generatori\u0173, kuris leid\u017Eia dirbti ilgai, palaikyti aktyv\u0173 socialin\u012F gyvenim\u0105 ir greitai atsigauti po streso. \u0160is resursas daro tave patikima atrama kitiems: aplinkiniai jau\u010Dia tavo stabilum\u0105 ir ramyb\u0119. Tu gebi be vargo derinti protin\u012F darb\u0105 su fizine veikla, {i\u0161laikydamas|i\u0161laikydama} pastov\u0173 temp\u0105.",en:"A pair of twos represents the gold standard of steady, self-renewing vitality. You possess a dependable internal engine that sustains long work hours, active social engagement, and swift recovery from fatigue. This balanced reservoir makes you an anchor for those around you, as people naturally gravitate toward your grounded energy. You effortlessly bridge physical demands and intellectual tasks with consistent endurance."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: tolyg\u0173 akcent\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Gera energija (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"3",text:{lt:"Trys dvejetai suteikia stipr\u0173 ekstrasensorin\u012F ir energetin\u012F jautrum\u0105. Tavo k\u016Bnas akimirksniu nuskenuoja patalpos atmosfer\u0105 ir \u017Emoni\u0173 emocinius laukus, kartais net anks\u010Diau, nei jie patys tai \u012Fsis\u0105monina. \u0160i energija gali pasireik\u0161ti kaip a\u0161trus intuityvus vedimas arba staig\u016Bs j\u0117g\u0173 antpl\u016Bd\u017Eiai, leid\u017Eiantys atlikti mil\u017Eini\u0161kos apimties darbus. {I\u0161mok\u0119s|I\u0161mokusi} atskirti svetimas nuotaikas nuo sav\u0173, tampi {ne\u012Fveikiamu strategu ir nat\u016Braliu gydytoju|ne\u012Fveikiama stratege ir nat\u016Bralia gydytoja}.",en:"Three twos endow you with heightened psychosomatic sensitivity and a dynamic energetic field. Your system instantly reads room atmospheres and emotional undercurrents before words are spoken. This vibration surfaces as sharp intuitive guidance or sudden surges of immense vitality capable of turning mountains. When you master screening out external noise, this becomes an exceptional gift for healing, influence, and strategic empathy."},question:{lt:"",en:""},traditionalBand:"Bendros skaitmen\u0173 kiekio skal\u0117s redakcija: situaci\u0161kai suaktyv\u0117jant\u012F akcent\u0105; ne individuali\u0173 savybi\u0173 \u012Fvertinimas.",originalTraditionalBand:"Didel\u0117 energija (instrumo.ru)",provenance:{sourceIds:["user-v7-gemini-package"],verification:"User-supplied literary/archetypal text; gender-neutral editorial pass; physiological statements adapted as metaphors; not scientifically verified",appliesTo:["text.lt","text.en","question.lt","question.en"]}},{countBand:"4",text:{lt:"Keturi dvejetai formuoja galing\u0105 biolauk\u0105 ir didel\u012F magnetizm\u0105. Tu turi energijos pertekli\u0173, kuris aplinkiniams tampa matomas net fiziniame lygmenyje: charizma, \u012Ftaiga, geb\u0117jimas patraukti paskui save minias. \u0160is potencialas reikalauja didelio mastelio i\u0161krovos \u2013 sporto, plataus verslo ar vie\u0161osios veiklos. U\u017Esistov\u0117jusi tokio lygio energija kelia vidin\u0119 \u012Ftamp\u0105, tod\u0117l jud\u0117jimas ir ekspansija tau yra b\u016Btina b\u016Bsena.",en:"Four twos generate an intense bio-magnetic current and immense personal presence. You possess a dense energetic reserve that manifests as natural magnetism, commanding charisma, and instinctive physical power. This density demands large-scale outlets: athletic rigors, commanding enterprises, or public-facing projects. Because stagnant energy causes restlessness, continuous forward momentum and ambitious targets are essential."},question:{
